name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح لك تشغله يدوياً من صفحة Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # ✅ الرجوع لطريقة قبول التراخيص اليدوية (اللي كانت شغالة معك)
    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        echo -e "\n24333f8a43b681627c059ef6a9b573678ef93c03" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo -e "d56f5187479451eabf01fb78af6dfcb131a648ab" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license

    # ⚠️ هذا القسم احتياطي فقط لتوليد أيقونات وهمية إذا كانت ناقصة
    # إذا كنت تملك أيقونات حقيقية، احذف هذا القسم بالكامل
    - name: Generate Missing Resources (Fallback)
      run: |
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/values

        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png

        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.Material3.DayNight.NoActionBar" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

    - name: Generate Wrapper and Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace || {
          echo "=== 🔍 BUILD FAILED - DUMPING LOGS ==="
          find app/build -name "*.log" -exec cat {} \;
          exit 1
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aether-thrones-apk
        path: app/build/outputs/apk/debug/app-debug.apk
