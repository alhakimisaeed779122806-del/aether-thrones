name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Accept Android SDK licenses
      run: |
        mkdir -p $ANDROID_SDK_ROOT/licenses
        echo -e "\n24333f8a43b681627c059ef6a9b573678ef93c03" > $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo -e "84831b9409646a918e30573bab4c9c91346d8abd" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license
        echo -e "d56f5187479451eabf01fb78af6dfcb131a648ab" >> $ANDROID_SDK_ROOT/licenses/android-sdk-license

    - name: Generate Missing Resources and Fix Manifest
      run: |
        # إنشاء مجلدات الموارد إذا لم تكن موجودة
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/values

        # إنشاء أيقونة افتراضية بسيطة لتخطي خطأ AAPT
        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png

        # إنشاء ملف styles.xml يحتوي على الثيم المطلوب
        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.Material3.DayNight.NoActionBar" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

        # تصحيح مسارات المكتبات في ملفات البناء آلياً
        find . -name "build.gradle*" -exec sed -i 's/androidx.lifecycle.viewmodel-compose:2.7.0:/androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0/g' {} +
        find . -name "build.gradle*" -exec sed -i 's/androidx.lifecycle.viewmodel-compose/androidx.lifecycle:lifecycle-viewmodel-compose/g' {} +

    - name: Auto-configure Repositories, Settings and Properties
      run: |
        cat << 'EOF' > settings.gradle.kts
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Aether Thrones"
        include(":app")
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m
        EOF

    - name: Generate Wrapper and Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aether-thrones-apk
        path: app/build/outputs/apk/debug/app-debug.apk
