name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # يسمح لك تشغله يدوياً من صفحة Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle 8.5
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    # ⚠️ هذا القسم احتياطي فقط لتوليد أيقونات وهمية إذا كانت ناقصة
    # إذا كنت تملك أيقونات حقيقية، احذف هذا القسم بالكامل
    - name: Generate Missing Resources (Fallback)
      run: |
        mkdir -p app/src/main/res/mipmap-hdpi
        mkdir -p app/src/main/res/values

        echo "iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8BQDwAEhQGAhKmMIQAAAABJRU5ErkJggg==" | base64 -d > app/src/main/res/mipmap-hdpi/ic_launcher.png
        cp app/src/main/res/mipmap-hdpi/ic_launcher.png app/src/main/res/mipmap-hdpi/ic_launcher_round.png

        cat << 'EOF' > app/src/main/res/values/styles.xml
        <resources>
            <style name="Theme.Material3.DayNight.NoActionBar" parent="android:Theme.Material.Light.NoActionBar" />
        </resources>
        EOF

    # حذفنا أمر sed لأننا عدلنا المكتبة في build.gradle.kts مباشرة

    - name: Generate Wrapper and Build APK
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace || {
          echo "=== 🔍 BUILD FAILED - DUMPING LOGS ==="
          find app/build -name "*.log" -exec cat {} \;
          exit 1
        }

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: aether-thrones-apk
        path: app/build/outputs/apk/debug/app-debug.apk
